[package]
name = "libertas-weather_agent"
version = "0.1.0"
edition = "2024"
description = "Libertas application-tailored weather agent"

[dependencies]
libertas = { path = "../../../rust/libertas-rs/crates/libertas", package = "libertas" }
libertas-hub = { path = "../../../rust/libertas-rs/crates/libertas-hub", package = "libertas-hub" }
libertas_macros = { path = "../../../rust/libertas-rs/crates/libertas_macros", package = "libertas_macros" }
libertas-weather = { path = "../libertas-weather", package = "libertas-weather" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "gzip", "query", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "libertas_weather_agent"
crate-type = ["rlib"]

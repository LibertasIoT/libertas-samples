[package]
name = "libertas-building_climate"
version = "0.1.0"
edition = "2024"
description = "Whole-building, room-aware climate controller for Libertas"

[dependencies]
libertas = { path = "../../../rust/libertas-rs/crates/libertas", package = "libertas" }
libertas_macros = { path = "../../../rust/libertas-rs/crates/libertas_macros", package = "libertas_macros" }
libertas-matter = { path = "../../../rust/libertas-matter/libertas-matter", package = "libertas-matter", default-features = false, features = ["alloc"] }
libertas-weather = { path = "../libertas-weather", package = "libertas-weather" }
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["process"] }
xgb = { version = "3.0.5", default-features = false, features = ["local_build"] }

[patch.crates-io]
xgboost_lib-sys = { path = "vendor/xgboost_lib-sys" }

[lib]
name = "libertas_building_climate"
crate-type = ["rlib"]

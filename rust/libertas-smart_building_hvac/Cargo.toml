[package]
name = "libertas-smart_building_hvac"
version = "0.1.0"
edition = "2024"
description = "Whole-building, room-aware HVAC controller for Libertas"

[dependencies]
libertas = { git = "https://github.com/LibertasIoT/libertas-rs.git", branch = "main", package = "libertas" }
libertas_macros = { git = "https://github.com/LibertasIoT/libertas-rs.git", branch = "main", package = "libertas_macros" }
libertas-matter = { git = "https://github.com/LibertasIoT/libertas-matter", package = "libertas-matter", default-features = false, features = ["alloc"] }
libertas-weather = { path = "../libertas-weather", package = "libertas-weather" }
libm = "0.2"

[patch."https://github.com/LibertasIoT/libertas-rs.git"]
libertas = { path = "../../../rust/libertas-rs/crates/libertas" }
libertas_macros = { path = "../../../rust/libertas-rs/crates/libertas_macros" }

[lib]
name = "libertas_smart_building_hvac"
crate-type = ["rlib"]
